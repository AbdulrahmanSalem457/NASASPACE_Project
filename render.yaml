services:
  # ==========================================
  # 1. AstroVitals AI Backend (Django REST)
  # ==========================================
  - type: web
    name: astrovitals-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn astrovitals.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

  # ==========================================
  # 2. AstroVitals AI Frontend (React + Vite)
  # ==========================================
  - type: web
    name: astrovitals-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: astrovitals-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
